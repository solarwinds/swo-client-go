query getCircleCIConnection($id: ID!) {
  vcs {
    getCircleCIConnection(id: $id) {
      id
      name
      secretToken
    }
  }
}

mutation createCircleCIConnection(
  $name: String!
  $apiToken: String
  $apiTokenName: String
) {
  vcs {
    createCircleCIConnection(
      name: $name
      apiToken: $apiToken
      apiTokenName: $apiTokenName
    ) {
      id
      name
      secretToken
    }
  }
}

mutation updateCircleCIConnection(
  $id: ID!
  $name: String
  $apiToken: String
  $apiTokenName: String
) {
  vcs {
    updateCircleCIConnection(
      id: $id
      name: $name
      apiToken: $apiToken
      apiTokenName: $apiTokenName
    ) {
      id
      name
      secretToken
    }
  }
}

mutation deleteCircleCIConnection($id: ID!) {
  vcs {
    deleteCircleCIConnection(id: $id) {
      success
    }
  }
}
